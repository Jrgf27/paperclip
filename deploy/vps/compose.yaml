services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperclip
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./install.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  paperclip:
    image: paperclip-vps:${PAPERCLIP_SOURCE_COMMIT:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        USER_UID: ${PAPERCLIP_USER_UID:-1000}
        USER_GID: ${PAPERCLIP_USER_GID:-1000}
        PAPERCLIP_BUILD_VERSION: ${PAPERCLIP_SOURCE_COMMIT:-local}
        PAPERCLIP_BUILD_COMMIT: ${PAPERCLIP_SOURCE_COMMIT:-local}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: public
      PAPERCLIP_PUBLIC_URL: https://${PAPERCLIP_DOMAIN:?Run ./install.sh first}
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run ./install.sh first}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?Run ./install.sh first}
    volumes:
      - ./data:/paperclip
    expose:
      - "3100"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PAPERCLIP_DOMAIN: ${PAPERCLIP_DOMAIN:?Run ./install.sh first}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      paperclip:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
